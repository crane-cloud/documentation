theme:
  name: material
  features:
    - content.code.copy
    - navigation.top         
    - navigation.instant    
    - search.suggest      
  favicon: img/favicon.png
  logo: img/logo.svg
  font:
    text: Google Sans
    code: Source Code Pro
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: light blue
      accent: blues
      toggle:
        icon: material/weather-night
        name: Switch to light mode
extra_css:
  - extra.css